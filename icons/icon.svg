<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e3d24"/>
      <stop offset="70%" stop-color="#082215"/>
      <stop offset="100%" stop-color="#04100a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#c8aa6e"/>
      <stop offset="100%" stop-color="#8a6c34"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dedede"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="51%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(200, 170, 110, 0.4)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Wing Left -->
  <g fill="#e6decb" stroke="#7a6b52" stroke-width="2">
    <path d="M 230,175 C 160,110 90,130 50,190 C 75,205 110,210 135,225 C 100,240 70,265 60,290 C 95,295 130,285 160,295 C 130,315 105,340 100,370 C 145,360 185,320 220,290 Z"/>
  </g>

  <!-- Wing Right -->
  <g fill="#e6decb" stroke="#7a6b52" stroke-width="2">
    <path d="M 282,175 C 352,110 422,130 462,190 C 437,205 402,210 377,225 C 412,240 442,265 452,290 C 417,295 382,285 352,295 C 382,315 407,340 412,370 C 367,360 327,320 292,290 Z"/>
  </g>

  <!-- Sword Crossguard -->
  <path d="M 170,165 L 342,165 L 348,180 L 164,180 Z" fill="url(#goldGrad)" stroke="#574218" stroke-width="2"/>
  <circle cx="166" cy="172" r="7" fill="url(#goldGrad)"/>
  <circle cx="346" cy="172" r="7" fill="url(#goldGrad)"/>

  <!-- Sword Hilt & Pommel -->
  <rect x="249" y="115" width="14" height="50" rx="3" fill="#3a2f26" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="256" cy="108" r="14" fill="url(#goldGrad)" stroke="#574218" stroke-width="2"/>

  <!-- Sword Blade -->
  <path d="M 244,180 L 268,180 L 265,410 L 256,445 L 247,410 Z" fill="url(#bladeGrad)" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="256" y1="180" x2="256" y2="415" stroke="#707070" stroke-width="2"/>
</svg>